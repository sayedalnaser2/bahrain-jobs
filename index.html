<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bahrain Jobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <span class="badge">🇧🇭 Kingdom of Bahrain</span>
      <h1>Find your next <span>career move</span> in Bahrain</h1>
      <p>Browse openings across the Kingdom, from Manama to Muharraq.</p>
      <form class="search" id="searchForm" role="search">
        <input id="q" type="search" placeholder="Job title, company or keyword" aria-label="Search jobs">
        <button type="submit">Search</button>
      </form>
      <div class="stats">
        <div><b id="sJobs">0</b>open jobs</div>
        <div><b id="sCos">0</b>companies</div>
        <div><b id="sAreas">0</b>locations</div>
      </div>
    </div>
  </header>

  <main class="wrap layout">
    <aside class="filters" aria-label="Filters">
      <h2>Filters</h2>
      <label>Category <select id="category"></select></label>
      <label>Location <select id="area"></select></label>
      <label>Job type <select id="type"></select></label>
      <label>Sort by
        <select id="sort">
          <option value="new">Newest first</option>
          <option value="az">Title A-Z</option>
        </select>
      </label>
      <button type="button" id="reset" class="ghost">Reset filters</button>
    </aside>

    <section>
      <div class="top">
        <p id="count" class="count" aria-live="polite"></p>
        <p class="notice" id="notice">Loading jobs…</p>
      </div>
      <ul id="list" class="list"></ul>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <button class="close" id="close" aria-label="Close">&times;</button>
      <h2 id="mTitle"></h2>
      <p id="mMeta" class="meta"></p>
      <p id="mDesc"></p>
      <a id="mApply" class="btn" target="_blank" rel="noopener">Apply now</a>
    </div>
  </div>

  <footer class="wrap foot">Bahrain Jobs &middot; <span id="year"></span></footer>

  <script src="jobs.js"></script>
  <script src="app.js"></script>
</body>
</html>
